services:
  cpa-usage-keeper:
    image: ghcr.io/willxup/cpa-usage-keeper:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent SQLite/WAL/backups. Stop Keeper and back up this volume before
      # keeper-export/v1 migrations; restore the backup before an older binary.
      # See docs/keeper-export.md.
      - ./data:/data
